version: '3.8'

services:

  qdrant:

    image: qdrant/qdrant:latest

    container_name: rag-qdrant

    restart: unless-stopped

    ports:

      - "6333:6333"

      - "6334:6334"

    volumes:

      - ./qdrant_storage:/qdrant/storage


  rag-api:

    build: .

    container_name: rag-api

    restart: unless-stopped

    ports:

      - "8010:8010"

    env_file:

      - .env

    volumes:

      - ./uploads:/app/uploads

      - hf_cache:/root/.cache/huggingface

    extra_hosts:

      - "host.docker.internal:host-gateway"

    depends_on:

      - qdrant


volumes:

  hf_cache:
